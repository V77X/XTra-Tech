<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AI Chat - XTra Tech</title>
    <link rel="stylesheet" href="style.css?v=1.2">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 100px;
        }
        .tool-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .tool-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .chat-box {
            background: rgba(255,255,255,.05);
            border-radius: 20px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,.08);
        }
        .message {
            margin: 12px 0;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            word-wrap: break-word;
        }
        .message.user {
            background: linear-gradient(135deg,#00e5ff,#7d4dff);
            color: #000;
            margin-left: auto;
            text-align: right;
        }
        .message.bot {
            background: rgba(255,255,255,.08);
            color: #fff;
            margin-right: auto;
        }
        .message.loading {
            color: #00e5ff;
            font-style: italic;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .input-group input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 14px;
            background: rgba(255,255,255,.05);
            color: #fff;
            font-size: 16px;
        }
        .input-group input::placeholder {
            color: #b8bfd6;
        }
        .input-group button {
            padding: 14px 26px;
            background: linear-gradient(135deg,#00e5ff,#7d4dff);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: .3s;
        }
        .input-group button:hover {
            box-shadow: 0 0 25px #00e5ff;
        }
        .input-group button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,.08);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .back-btn:hover {
            background: #00e5ff;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="circle c3"></div>
        <div class="circle c4"></div>
        <div class="grid"></div>
    </div>

    <div class="tool-container">
        <button class="back-btn" onclick="window.location.href='index.html'">← Back Home</button>
        
        <div class="tool-header">
            <h1>🤖 AI Chat Assistant</h1>
            <p>Powered by Real AI</p>
        </div>

        <div class="chat-box" id="chatBox"></div>
        
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Ask me anything...">
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="script.js?v=1.2"></script>
    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Welcome message
        window.addEventListener('load', () => {
            setTimeout(() => {
                const welcomeMsg = document.createElement('div');
                welcomeMsg.className = 'message bot';
                welcomeMsg.textContent = 'Hello! 👋 I\'m your AI Assistant. Ask me anything and I\'ll help!';
                chatBox.appendChild(welcomeMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 300);
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // User message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = message;
            chatBox.appendChild(userMsg);

            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Loading message
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message bot loading';
            loadingMsg.textContent = 'Thinking...';
            chatBox.appendChild(loadingMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            sendBtn.disabled = true;

            try {
                // Using Hugging Face Inference API (Free tier available)
                const response = await fetch(
                    "https://api-inference.huggingface.co/models/gpt2",
                    {
                        headers: { Authorization: `Bearer hf_qwERTYuiopASDFGHJKLzxcvbnm` },
                        method: "POST",
                        body: JSON.stringify({ inputs: message, parameters: { max_new_tokens: 100 } }),
                    }
                );

                const result = await response.json();
                chatBox.removeChild(loadingMsg);

                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                
                if (result[0] && result[0].generated_text) {
                    botMsg.textContent = result[0].generated_text.replace(message, '').trim() || "That's an interesting question! I'm still learning. Try asking something specific.";
                } else {
                    // Fallback responses if API doesn't work
                    const fallbackResponses = [
                        "That's a great question! Let me think about that...",
                        "Interesting! Here's what I know about that...",
                        "I understand. Based on your question...",
                        "That's something I can help with!",
                        "Good question! Let me provide some insights..."
                    ];
                    botMsg.textContent = fallbackResponses[Math.floor(Math.random() * fallbackResponses.length)];
                }
                
                chatBox.appendChild(botMsg);
            } catch (error) {
                console.error('Error:', error);
                chatBox.removeChild(loadingMsg);
                
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message bot';
                errorMsg.textContent = 'Sorry, I encountered an error. Please try again!';
                chatBox.appendChild(errorMsg);
            }

            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
