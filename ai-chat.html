<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - XTra Tech</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 100px;
        }
        .tool-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .tool-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .chat-box {
            background: rgba(255,255,255,.05);
            border-radius: 20px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,.08);
        }
        .message {
            margin: 12px 0;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 70%;
        }
        .message.user {
            background: linear-gradient(135deg,#00e5ff,#7d4dff);
            color: #000;
            margin-left: auto;
            text-align: right;
        }
        .message.bot {
            background: rgba(255,255,255,.08);
            color: #fff;
            margin-right: auto;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .input-group input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 14px;
            background: rgba(255,255,255,.05);
            color: #fff;
            font-size: 16px;
        }
        .input-group input::placeholder {
            color: #b8bfd6;
        }
        .input-group button {
            padding: 14px 26px;
            background: linear-gradient(135deg,#00e5ff,#7d4dff);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: .3s;
        }
        .input-group button:hover {
            box-shadow: 0 0 25px #00e5ff;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,.08);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .back-btn:hover {
            background: #00e5ff;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="circle c3"></div>
        <div class="circle c4"></div>
        <div class="grid"></div>
    </div>

    <div class="tool-container">
        <button class="back-btn" onclick="window.location.href='index.html'">← Back Home</button>
        
        <div class="tool-header">
            <h1>🤖 AI Chat Assistant</h1>
            <p>Ask me anything!</p>
        </div>

        <div class="chat-box" id="chatBox"></div>
        
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        const responses = [
            "That's a great question! Let me help you with that.",
            "Interesting! I'm here to assist you.",
            "I understand. Here's what I can tell you:",
            "Great! I'm learning more about that.",
            "That's something I can definitely help with!",
            "I appreciate you asking! Let me think about that.",
            "You've asked a good question. The answer is...",
            "I'm here to help! Let me provide some insights.",
        ];

        function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // User message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = message;
            chatBox.appendChild(userMsg);

            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Bot response
            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                botMsg.textContent = randomResponse + ' "' + message + '"';
                chatBox.appendChild(botMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Welcome message
        setTimeout(() => {
            const welcomeMsg = document.createElement('div');
            welcomeMsg.className = 'message bot';
            welcomeMsg.textContent = 'Hello! 👋 I\'m your AI Assistant. How can I help you today?';
            chatBox.appendChild(welcomeMsg);
        }, 500);
    </script>
</body>
</html>
