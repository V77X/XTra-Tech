      body {

      @keyframes gradientBG {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;

      .glass-panel {

      }

      .calc-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.1s ease-in-out;
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }

      .calc-btn:active {
        transform: scale(0.9);
      }

      /* Ripple effect */
      .calc-btn::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
        transition:
          transform 0.3s,
          opacity 0.3s;
      }

      .calc-btn:active::after {
        transform: translate(-50%, -50%) scale(2);
        opacity: 1;
        transition: 0s;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {

      // State Variables
      let currentExpression = '';

      let isEvaluated = false;
      let isDegrees = true;

      // Format number to fit screen nicely
      function formatNumber(numStr) {
          if (['Error', 'Infinity', '-Infinity', 'NaN'].includes(numStr)) return numStr;
          let parts = numStr.toString().split('.');
          parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          if (parts[1]) {
              parts[1] = parts[1].substring(0, 10);
              return parts.join('.');
          }
          return parts[0];
      }

      // Update displays
      function updateDisplay() {
          mainDisplay.innerText = formatNumber(currentInput);
          exprDisplay.innerText = currentExpression;

          // Auto resize text
          if (currentInput.length > 11) {
              mainDisplay.style.fontSize = Math.max(1.75, 3.75 - (currentInput.length - 11) * 0.15) + 'rem';
          } else {
              mainDisplay.style.fontSize = '';
          }
          exprDisplay.scrollLeft = exprDisplay.scrollWidth;
      }

      function appendVal(val) {
          if (isEvaluated) { currentInput = ''; currentExpression = ''; isEvaluated = false; }
          if (currentInput === '0' && val !== '.') currentInput = val;
          else if (val === '.' && currentInput.includes('.')) return;
          else currentInput += val;
          updateDisplay();
      }

      function appendOp(op) {
          if (isEvaluated) { currentExpression = currentInput; isEvaluated = false; }
          else if (currentInput !== '') currentExpression += ' ' + currentInput;

          const lastChar = currentExpression.trim().slice(-1);
          if (['+', '−', '×', '÷'].includes(lastChar) && currentInput === '') {
              currentExpression = currentExpression.trim().slice(0, -1) + ' ' + op;
          } else {
              currentExpression += ' ' + op;
          }
          currentInput = '';
          updateDisplay();
      }

      function appendSci(func) {
          if (isEvaluated) { currentExpression = ''; isEvaluated = false; }
          if (func.endsWith('(')) { currentExpression += ' ' + func; currentInput = ''; }
          else if (['π', 'e'].includes(func)) currentInput = func;
          else if (func === '!' && currentInput !== '') currentInput += '!';
          else if (func === '^' && currentInput !== '') { currentExpression += ' ' + currentInput + ' ^ '; currentInput = ''; }
          updateDisplay();
      }

      function toggleSign() {
          if (currentInput === '0' || currentInput === '') return;
          currentInput = currentInput.startsWith('-') ? currentInput.substring(1) : '-' + currentInput;
          updateDisplay();
      }

      function clearAll() {
          currentInput = '0'; currentExpression = ''; isEvaluated = false; updateDisplay();
      }

      function deleteLast() {
          if (isEvaluated) return clearAll();
          currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : '0';
          updateDisplay();
      }

      function factorial(n) {
          if (n < 0) return NaN;
          if (n === 0 || n === 1) return 1;
          let result = 1; for (let i = 2; i <= n; i++) result *= i;
          return result;
      }

      function calculate() {
          if (currentInput !== '') { currentExpression += ' ' + currentInput; currentInput = ''; }
          if (!currentExpression.trim()) return;

          const exprToStore = currentExpression;
          let parseStr = currentExpression
              .replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-')
              .replace(/([\d.]+)\s*%/g, '($1/100)')
              .replace(/π/g, 'Math.PI').replace(/e/g, 'Math.E')
              .replace(/(\d+\.?\d*)!/g, 'factorial($1)')
              .replace(/\^/g, '**');

          const radConv = isDegrees ? '(Math.PI/180)*' : '';
          const radInvConv = isDegrees ? '*(180/Math.PI)' : '';

          parseStr = parseStr.replace(/asin\(/g, radInvConv + 'Math.asin(').replace(/acos\(/g, radInvConv + 'Math.acos(').replace(/atan\(/g, radInvConv + 'Math.atan(')
              .replace(/sin\(/g, 'Math.sin(' + radConv).replace(/cos\(/g, 'Math.cos(' + radConv).replace(/tan\(/g, 'Math.tan(' + radConv)
              .replace(/log\(/g, 'Math.log10(').replace(/ln\(/g, 'Math.log(').replace(/√\(/g, 'Math.sqrt(').replace(/abs\(/g, 'Math.abs(');

          try {
              const open = (parseStr.match(/\(/g) || []).length, close = (parseStr.match(/\)/g) || []).length;
              if (open > close) parseStr += ')'.repeat(open - close);

              let result = new Function('factorial', 'return ' + parseStr)(factorial);
              if (typeof result === 'number') result = parseFloat(result.toPrecision(15));

              currentInput = result.toString();
              addToHistory(exprToStore + ' =', currentInput);
              currentExpression += ' =';
              isEvaluated = true;
          } catch (e) {
              currentInput = 'Error'; isEvaluated = true;
          }
          updateDisplay();
      }

      function addToHistory(expr, result) {
          history.unshift({ expr, result });
          if (history.length > 20) history.pop();
