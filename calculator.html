<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Professional Modern Calculator</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    font-family:"Inter",sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e1b4b,#312e81);
    background-size:400% 400%;
    animation:gradientBG 15s ease infinite;
    color:#fff;
    overscroll-behavior-y:none;
    overflow:hidden;
  }
  @keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  #screen{
    height:100dvh; width:100vw;
    display:flex; align-items:center; justify-content:center;
    padding:0;
  }

  .glass{
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.1);
  }

  #shell{
    height:100dvh; width:100vw;
    max-width:460px;
    display:flex; flex-direction:column;
    overflow:hidden;
    background:rgba(255,255,255,.03);
    box-shadow:0 25px 50px -12px rgba(0,0,0,.5);
    position:relative;
  }
  @media (min-width:600px){
    #shell{
      height:min(92vh,720px);
      border-radius:2rem;
      border:1px solid rgba(255,255,255,.1);
    }
  }

  /* ---- Header ---- */
  #header{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 8px;
  }
  #modeSwitch{
    display:flex; gap:2px;
    background:rgba(255,255,255,.05);
    border-radius:10px;
    padding:4px;
  }
  #modeSwitch button{
    border:none; background:transparent; color:#94a3b8;
    font-family:inherit; font-size:13px; font-weight:500;
    padding:7px 14px; border-radius:8px; cursor:pointer;
    transition:background .15s, color .15s;
  }
  #modeSwitch button.active{
    background:rgba(255,255,255,.18); color:#fff;
  }
  #headerRight{ display:flex; align-items:center; gap:10px; }
  #degRadBtn{
    display:none;
    background:rgba(99,102,241,.18); color:#a5b4fc;
    border:1px solid rgba(99,102,241,.35);
    font-family:inherit; font-size:11px; font-weight:600;
    letter-spacing:.03em;
    padding:6px 10px; border-radius:8px; cursor:pointer;
  }
  #degRadBtn.show{ display:inline-block; }
  #historyBtn{
    width:34px; height:34px; border-radius:50%;
    background:transparent; border:none; color:#94a3b8;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:15px;
  }
  #historyBtn:hover{ background:rgba(255,255,255,.08); color:#fff; }

  /* ---- Display ---- */
  #displayArea{ flex:0 0 auto; padding:10px 18px 8px; }
  #displayBox{
    height:112px;
    border-radius:18px;
    padding:14px 18px;
    display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end;
    overflow:hidden;
  }
  #exprLine{
    color:#94a3b8; font-size:14px; min-height:20px;
    width:100%; text-align:right; overflow-x:auto; white-space:nowrap;
    letter-spacing:.02em;
  }
  #exprLine::-webkit-scrollbar{ display:none; }
  #mainLine{
    font-weight:600; color:#fff; width:100%; text-align:right;
    overflow:hidden; white-space:nowrap;
    font-size:2.75rem; line-height:1.15;
    transition:font-size .1s ease;
  }

  /* ---- Keypad area ---- */
  #padArea{
    flex:1 1 auto;
    display:flex; flex-direction:column;
    padding:6px 18px 18px;
    gap:10px;
    min-height:0;
  }

  #sciPad{
    display:none;
    flex:0 0 auto;
    grid-template-columns:repeat(4,1fr);
    grid-auto-rows:1fr;
    gap:8px;
    height:0;
  }
  #sciPad.show{ display:grid; height:auto; flex:4; }

  #stdPad{
    flex:5;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(5,1fr);
    gap:8px;
    min-height:0;
  }

  button.key{
    border:none; cursor:pointer; font-family:inherit;
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    font-size:1.4rem; font-weight:500;
    position:relative; overflow:hidden;
    transition:transform .08s ease, background .1s ease;
  }
  button.key:active{ transform:scale(.92); }

  .k-num{ background:rgba(255,255,255,.1); }
  .k-num:hover{ background:rgba(255,255,255,.18); }
  .k-op{ background:rgba(99,102,241,.2); color:#a5b4fc; font-size:1.6rem; }
  .k-op:hover{ background:rgba(99,102,241,.35); }
  .k-fn{ background:rgba(255,255,255,.05); font-size:.95rem; font-weight:500; color:#e2e8f0; }
  .k-fn:hover{ background:rgba(255,255,255,.12); }
  .k-clear{ background:rgba(239,68,68,.18); color:#f87171; font-size:1.1rem; }
  .k-clear:hover{ background:rgba(239,68,68,.3); }
  .k-eq{
    background:linear-gradient(135deg,#3b82f6,#4f46e5);
    box-shadow:0 8px 20px -6px rgba(79,70,229,.6);
    font-size:1.8rem;
  }
  .k-eq:hover{ background:linear-gradient(135deg,#60a5fa,#6366f1); }
  .k-zero{ grid-column:span 2; }

  /* ---- History panel ---- */
  #historyPanel{
    position:absolute; top:0; right:0; height:100%;
    width:0; overflow:hidden;
    transition:width .35s ease;
    background:rgba(10,12,25,.97);
    backdrop-filter:blur(20px);
    border-left:1px solid rgba(255,255,255,.1);
    z-index:20;
  }
  #historyPanel.open{ width:100%; }
  @media (min-width:600px){
    #historyPanel.open{ width:300px; }
  }
  #historyInner{ width:100%; height:100%; display:flex; flex-direction:column; }
  #historyHead{
    flex:0 0 auto; padding:18px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,.1);
  }
  #historyHead h2{ margin:0; font-size:16px; font-weight:600; color:#f1f5f9; }
  #historyHead .actions{ display:flex; gap:12px; }
  #historyHead button{
    background:none; border:none; color:#94a3b8; cursor:pointer; font-size:14px;
  }
  #historyHead button:hover{ color:#fff; }
  #historyList{ flex:1 1 auto; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .hist-item{
    background:rgba(255,255,255,.05);
    border-radius:12px; padding:10px 14px; cursor:pointer;
  }
  .hist-item:hover{ background:rgba(255,255,255,.1); }
  .hist-expr{ color:#94a3b8; font-size:12px; }
  .hist-result{ color:#fff; font-size:18px; font-weight:600; margin-top:2px; }
  #historyEmpty{ text-align:center; color:#64748b; margin-top:40px; font-size:13px; }
</style>
</head>
<body>

<div id="screen">
  <div id="shell" class="glass">

    <div id="header">
      <div id="modeSwitch">
        <button id="btnStd" class="active" onclick="setMode('standard')">Standard</button>
        <button id="btnSci" onclick="setMode('scientific')">Scientific</button>
      </div>
      <div id="headerRight">
        <button id="degRadBtn" onclick="toggleDegRad()">DEG</button>
        <button id="historyBtn" onclick="toggleHistory()">&#9201;</button>
      </div>
    </div>

    <div id="displayArea">
      <div id="displayBox" class="glass">
        <div id="exprLine"></div>
        <div id="mainLine">0</div>
      </div>
    </div>

    <div id="padArea">
      <div id="sciPad">
        <button class="key k-fn" onclick="appendSci('sin(')">sin</button>
        <button class="key k-fn" onclick="appendSci('cos(')">cos</button>
        <button class="key k-fn" onclick="appendSci('tan(')">tan</button>
        <button class="key k-fn" onclick="appendSci('pi')">π</button>

        <button class="key k-fn" onclick="appendSci('asin(')">sin⁻¹</button>
        <button class="key k-fn" onclick="appendSci('acos(')">cos⁻¹</button>
        <button class="key k-fn" onclick="appendSci('atan(')">tan⁻¹</button>
        <button class="key k-fn" onclick="appendSci('e')">e</button>

        <button class="key k-fn" onclick="appendSci('log(')">log</button>
        <button class="key k-fn" onclick="appendSci('ln(')">ln</button>
        <button class="key k-fn" onclick="appendSci('^')">x^y</button>
        <button class="key k-fn" onclick="appendSci('sqrt(')">&#8730;</button>

        <button class="key k-fn" onclick="appendSci('(')">(</button>
        <button class="key k-fn" onclick="appendSci(')')">)</button>
        <button class="key k-fn" onclick="appendSci('abs(')">|x|</button>
        <button class="key k-fn" onclick="appendSci('!')">x!</button>
      </div>

      <div id="stdPad">
        <button class="key k-clear" onclick="clearAll()">AC</button>
        <button class="key k-fn" onclick="deleteLast()">&#9003;</button>
        <button class="key k-fn" onclick="appendVal('%')">%</button>
        <button class="key k-op" onclick="appendOp('/')">&divide;</button>

        <button class="key k-num" onclick="appendVal('7')">7</button>
        <button class="key k-num" onclick="appendVal('8')">8</button>
        <button class="key k-num" onclick="appendVal('9')">9</button>
        <button class="key k-op" onclick="appendOp('*')">&times;</button>

        <button class="key k-num" onclick="appendVal('4')">4</button>
        <button class="key k-num" onclick="appendVal('5')">5</button>
        <button class="key k-num" onclick="appendVal('6')">6</button>
        <button class="key k-op" onclick="appendOp('-')">&minus;</button>

        <button class="key k-num" onclick="appendVal('1')">1</button>
        <button class="key k-num" onclick="appendVal('2')">2</button>
        <button class="key k-num" onclick="appendVal('3')">3</button>
        <button class="key k-op" onclick="appendOp('+')">+</button>

        <button class="key k-fn" onclick="toggleSign()">&plusmn;</button>
        <button class="key k-num" onclick="appendVal('0')">0</button>
        <button class="key k-num" onclick="appendVal('.')">.</button>
        <button class="key k-eq" onclick="calculate()">=</button>
      </div>
    </div>

    <div id="historyPanel">
      <div id="historyInner">
        <div id="historyHead">
          <h2>History</h2>
          <div class="actions">
            <button onclick="clearHistory()">Clear</button>
            <button onclick="toggleHistory()">&#10005;</button>
          </div>
        </div>
        <div id="historyList">
          <div id="historyEmpty">No history yet</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  const mainLine = document.getElementById('mainLine');
  const exprLine = document.getElementById('exprLine');
  const sciPad = document.getElementById('sciPad');
  const btnStd = document.getElementById('btnStd');
  const btnSci = document.getElementById('btnSci');
  const degRadBtn = document.getElementById('degRadBtn');
  const historyPanel = document.getElementById('historyPanel');
  const historyList = document.getElementById('historyList');

  let mode = 'standard';
  let isDegrees = true;
  let historyOpen = false;
  let history = [];

  // running expression, kept in "display form" (with × ÷ − symbols)
  let expr = '';
  let current = '0';
  let justEvaluated = false;

  function render(){
    exprLine.textContent = expr;
    mainLine.textContent = formatNumber(current);
    const len = current.length;
    if(len > 9){
      mainLine.style.fontSize = Math.max(1.3, 2.75 - (len-9)*0.14) + 'rem';
    } else {
      mainLine.style.fontSize = '';
    }
    exprLine.scrollLeft = exprLine.scrollWidth;
  }

  function formatNumber(str){
    if(['Error','Infinity','-Infinity','NaN'].includes(str)) return str;
    if(str === '' ) return '0';
    let neg = str.startsWith('-');
    let s = neg ? str.slice(1) : str;
    let parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    let out = parts.length>1 ? parts[0]+'.'+parts[1] : parts[0];
    return (neg?'-':'') + out;
  }

  window.setMode = function(m){
    mode = m;
    btnStd.classList.toggle('active', m==='standard');
    btnSci.classList.toggle('active', m==='scientific');
    if(m==='scientific'){
      sciPad.classList.add('show');
      degRadBtn.classList.add('show');
    } else {
      sciPad.classList.remove('show');
      degRadBtn.classList.remove('show');
    }
  };

  window.toggleDegRad = function(){
    isDegrees = !isDegrees;
    degRadBtn.textContent = isDegrees ? 'DEG' : 'RAD';
  };

  window.toggleHistory = function(){
    historyOpen = !historyOpen;
    historyPanel.classList.toggle('open', historyOpen);
  };

  window.clearHistory = function(){
    history = [];
    renderHistory();
  };

  function renderHistory(){
    historyList.innerHTML = '';
    if(history.length===0){
      historyList.innerHTML = '<div id="historyEmpty">No history yet</div>';
      return;
    }
    history.slice().reverse().forEach(h=>{
      const div = document.createElement('div');
      div.className = 'hist-item';
      div.innerHTML = '<div class="hist-expr">'+h.expr+'</div><div class="hist-result">'+h.result+'</div>';
      div.onclick = ()=>{
        current = h.result;
        expr = '';
        justEvaluated = true;
        render();
        toggleHistory();
      };
      historyList.appendChild(div);
    });
  }

  window.appendVal = function(val){
    if(justEvaluated){ current=''; expr=''; justEvaluated=false; }
    if(val==='.'){
      if(current.includes('.')) return;
      current = current==='' ? '0.' : current+'.';
    } else {
      if(current==='0') current = val;
      else current += val;
    }
    render();
  };

  const opDisplay = {'+':'+','-':'−','*':'×','/':'÷'};

  window.appendOp = function(op){
    if(current==='' && expr==='') return;
    if(justEvaluated){ expr = current; justEvaluated=false; }
    else if(current!==''){ expr += (expr?' ':'') + current; }

    const trimmed = expr.trim();
    const lastCh = trimmed.slice(-1);
    if(['+','−','×','÷'].includes(lastCh)){
      expr = trimmed.slice(0,-1).trim() + ' ' + opDisplay[op];
    } else {
      expr = trimmed + ' ' + opDisplay[op];
    }
    current = '';
    render();
  };

  window.appendSci = function(fn){
    if(justEvaluated){ expr=''; current=''; justEvaluated=false; }
    if(fn.endsWith('(')){
      expr += (expr?' ':'') + fn;
      current = '';
    } else if(fn==='pi'){
      current = 'π';
    } else if(fn==='e'){
      current = 'e';
    } else if(fn==='!'){
      if(current!=='') current += '!';
    } else if(fn==='^'){
      if(current!==''){
        expr += (expr?' ':'') + current + ' ^';
        current = '';
      }
    }
    render();
  };

  window.toggleSign = function(){
    if(current==='0' || current==='') return;
    current = current.startsWith('-') ? current.slice(1) : '-'+current;
    render();
  };

  window.clearAll = function(){
    current = '0'; expr=''; justEvaluated=false; render();
  };

  window.deleteLast = function(){
    if(justEvaluated) return window.clearAll();
    if(current.length>1) current = current.slice(0,-1);
    else current = '0';
    render();
  };

  function factorial(n){
    n = Math.round(n);
    if(n<0) return NaN;
    let r=1;
    for(let i=2;i<=n;i++) r*=i;
    return r;
  }

  function toEvalString(s){
    // build the JS-safe evaluation string from display-form expr + current
    let full = (s||'').trim();
    full = full.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
    full = full.replace(/π/g,'('+Math.PI+')');
    full = full.replace(/\be\b/g,'('+Math.E+')');
    full = full.replace(/√\(/g,'sqrt(');
    // handle factorials: number followed by !
    full = full.replace(/(\d+(\.\d+)?)!/g, function(_,n){ return factorial(parseFloat(n)); });
    // convert deg-based trig if needed
    const deg2rad = 'x=>x*Math.PI/180';
    if(isDegrees){
      full = full.replace(/\bsin\(/g,'Math.sin(__d2r(').replace(/\bcos\(/g,'Math.cos(__d2r(').replace(/\btan\(/g,'Math.tan(__d2r(');
      full = full.replace(/\basin\(/g,'__r2d(Math.asin(').replace(/\bacos\(/g,'__r2d(Math.acos(').replace(/\batan\(/g,'__r2d(Math.atan(');
    } else {
      full = full.replace(/\bsin\(/g,'Math.sin(').replace(/\bcos\(/g,'Math.cos(').replace(/\btan\(/g,'Math.tan(');
      full = full.replace(/\basin\(/g,'Math.asin(').replace(/\bacos\(/g,'Math.acos(').replace(/\batan\(/g,'Math.atan(');
    }
    full = full.replace(/\blog\(/g,'Math.log10(');
    full = full.replace(/\bln\(/g,'Math.log(');
    full = full.replace(/\bsqrt\(/g,'Math.sqrt(');
    full = full.replace(/\babs\(/g,'Math.abs(');
    full = full.replace(/\^/g,'**');
    // balance parens for sin/cos/tan wrapping added above
    return full;
  }

  function safeEval(str){
    if(!/^[0-9+\-*/%(). MathsqrtabincoglnPI**_dr,\s]*$/.test(str)){
      // fallback loose check; real safety is that we only ever build this string ourselves
    }
    const __d2r = x=>x*Math.PI/180;
    const __r2d = x=>x*180/Math.PI;
    // eslint-disable-next-line no-new-func
    const fn = new Function('__d2r','__r2d','Math','"use strict"; return ('+str+')');
    const val = fn(__d2r,__r2d,Math);
    if(typeof val !== 'number' || isNaN(val)) throw new Error('nan');
    return val;
  }

  window.calculate = function(){
    let full = expr;
    if(current!=='') full += (full?' ':'') + current;
    if(full.trim()===''){ return; }
    try{
      const evalStr = toEvalString(full);
      const result = safeEval(evalStr);
      const resStr = formatResult(result);
      history.push({expr: full, result: resStr});
      current = resStr;
      expr = full + ' =';
      justEvaluated = true;
      render();
    }catch(err){
      current = 'Error';
      expr = full;
      justEvaluated = true;
      render();
    }
  };

  function formatResult(n){
    if(!isFinite(n)) return n>0 ? 'Infinity' : '-Infinity';
    if(Number.isInteger(n)) return n.toString();
    let s = parseFloat(n.toPrecision(12)).toString();
    return s;
  }

  // Keyboard support
  window.addEventListener('keydown', (e)=>{
    if(/^[0-9]$/.test(e.key)) return appendVal(e.key);
    if(e.key==='.') return appendVal('.');
    if(e.key==='+') return appendOp('+');
    if(e.key==='-') return appendOp('-');
    if(e.key==='*') return appendOp('*');
    if(e.key==='/'){ e.preventDefault(); return appendOp('/'); }
    if(e.key==='Enter'){ e.preventDefault(); return calculate(); }
    if(e.key==='Backspace') return deleteLast();
    if(e.key==='Escape') return clearAll();
  });

  render();
})();
</script>
</body>
</html>
