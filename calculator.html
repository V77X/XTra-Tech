    <script>
        // DOM Elements
        const mainDisplay = document.getElementById('main-display');
        const exprDisplay = document.getElementById('expression-display');
        const sciKeypad = document.getElementById('sci-keypad');
        const btnStdMode = document.getElementById('btn-std-mode');
        const btnSciMode = document.getElementById('btn-sci-mode');
        const degRadToggle = document.getElementById('deg-rad-toggle');
        const historyPanel = document.getElementById('history-panel');
        const historyList = document.getElementById('history-list');

        // State Variables
        let currentExpression = '';
        let currentInput = '0';
        let isEvaluated = false;
        let isDegrees = true;
        let history = [];

        // Format number to fit screen nicely
        function formatNumber(numStr) {
            if (numStr === 'Error' || numStr === 'Infinity' || numStr === '-Infinity' || numStr === 'NaN') return numStr;
            let parts = numStr.toString().split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            // limit decimal places to avoid overflow, but keep precision reasonable
            if (parts[1]) {
                parts[1] = parts[1].substring(0, 10);
                return parts.join('.');
            }
            return parts[0];
        }

        // Update displays
        function updateDisplay() {
            mainDisplay.innerText = formatNumber(currentInput);
            exprDisplay.innerText = currentExpression;
            
            // Auto resize text if it gets too long
            if (currentInput.length > 10) {
                mainDisplay.style.fontSize = Math.max(1.5, 3.75 - (currentInput.length - 10) * 0.15) + 'rem';
            } else {
                mainDisplay.style.fontSize = ''; // reset to default classes
            }
            
            // Auto scroll expression
            exprDisplay.scrollLeft = exprDisplay.scrollWidth;
        }

        // --- Core Calculator Actions ---

        function appendVal(val) {
            if (isEvaluated) {
                currentInput = '';
                currentExpression = '';
                isEvaluated = false;
            }

            if (currentInput === '0' && val !== '.') {
                currentInput = val;
            } else if (val === '.' && currentInput.includes('.')) {
                return; // Prevent multiple decimals
            } else {
                currentInput += val;
            }
            updateDisplay();
        }

        function appendOp(op) {
            if (isEvaluated) {
                currentExpression = currentInput;
                isEvaluated = false;
            } else if (currentInput !== '') {
                currentExpression += ' ' + currentInput;
            }
            
            // Check if last char is already an operator
            const lastChar = currentExpression.trim().slice(-1);
            if (['+', '−', '×', '÷'].includes(lastChar) && currentInput === '') {
                currentExpression = currentExpression.trim().slice(0, -1) + ' ' + op;
            } else {
                currentExpression += ' ' + op;
            }
            
            currentInput = '';
            updateDisplay();
        }

        function appendSci(func) {
            if (isEvaluated) {
                currentExpression = '';
                isEvaluated = false;
            }
            // If it's a function that wraps
            if (func.endsWith('(')) {
                currentExpression += ' ' + func;
                currentInput = '';
            } else if (func === 'π' || func === 'e') {
                currentInput = func;
            } else if (func === '!') {
                if (currentInput !== '') {
                    currentInput += '!';
                }
            } else if (func === '^') {
                if (currentInput !== '') {
                    currentExpression += ' ' + currentInput + ' ^ ';
                    currentInput = '';
                }
            } else if (func === '10^' || func === 'e^') {
                currentExpression += ' ' + func.replace('^', '^(');
                currentInput = '';
            } else if (func === '1/') {
                 if (currentInput !== '') {
                     currentInput = '1/(' + currentInput + ')';
                 }
            }
            updateDisplay();
        }

        function toggleSign() {
            if (currentInput === '0' || currentInput === '') return;
            if (currentInput.startsWith('-')) {
                currentInput = currentInput.substring(1);
            } else {
                currentInput = '-' + currentInput;
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            currentExpression = '';
            isEvaluated = false;
            updateDisplay();
        }

        function deleteLast() {
            if (isEvaluated) {
                clearAll();
                return;
            }
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        // --- Math Evaluation Logic ---

        // Helper to convert factorial
        function factorial(n) {
            if (n < 0) return NaN;
            if (n === 0 || n === 1) return 1;
            let result = 1;
            for (let i = 2; i <= n; i++) result *= i;
            return result;
        }

        // Safe parser for standard operations and scientific notation
        function calculate() {
            if (currentInput !== '') {
                currentExpression += ' ' + currentInput;
                currentInput = '';
            }
            if (!currentExpression.trim()) return;

            const exprToStore = currentExpression; // For history
            let parseStr = currentExpression;
            
            // 1. Replace display operators with JS operators
            parseStr = parseStr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
            
            // 2. Replace percentages (e.g., 50% -> 50/100)
            parseStr = parseStr.replace(/([\d.]+)\s*%/g, '($1/100)');

            // 3. Replace Pi and e
            parseStr = parseStr.replace(/π/g, 'Math.PI').replace(/e/g, 'Math.E');

            // 4. Handle Factorials
            parseStr = parseStr.replace(/(\d+\.?\d*)!/g, 'factorial($1)');

            // 5. Scientific functions conversion
            const radConv = isDegrees ? '(Math.PI/180)*' : '';
            const radInvConv = isDegrees ? '*(180/Math.PI)' : '';
            
            parseStr = parseStr.replace(/asin\(/g, radInvConv + 'Math.asin(');
            parseStr = parseStr.replace(/acos\(/g, radInvConv + 'Math.acos(');
            parseStr = parseStr.replace(/atan\(/g, radInvConv + 'Math.atan(');
            
            parseStr = parseStr.replace(/sin\(/g, 'Math.sin(' + radConv);
            parseStr = parseStr.replace(/cos\(/g, 'Math.cos(' + radConv);
            parseStr = parseStr.replace(/tan\(/g, 'Math.tan(' + radConv);
            
            parseStr = parseStr.replace(/log\(/g, 'Math.log10(');
            parseStr = parseStr.replace(/ln\(/g, 'Math.log(');
            parseStr = parseStr.replace(/√\(/g, 'Math.sqrt(');
            parseStr = parseStr.replace(/∛\(/g, 'Math.cbrt(');
            parseStr = parseStr.replace(/abs\(/g, 'Math.abs(');
            
            // 6. Powers
            parseStr = parseStr.replace(/\^/g, '**');

            try {
                // Ensure balanced parentheses
                const openCount = (parseStr.match(/\(/g) || []).length;
                const closeCount = (parseStr.match(/\)/g) || []).length;
                if (openCount > closeCount) {
                    parseStr += ')'.repeat(openCount - closeCount);
                }

                // Evaluate using Function (safe context client-side for math)
                // Warning: eval/Function is used here strictly for math expression string building.
                let result = new Function('factorial', 'return ' + parseStr)(factorial);
                
                // Fix JS floating point issues (e.g. 0.1 + 0.2)
                if (typeof result === 'number') {
                    result = parseFloat(result.toPrecision(15));
                }
                
                currentInput = result.toString();
                addToHistory(exprToStore + ' =', currentInput);
                currentExpression += ' =';
                isEvaluated = true;
                
            } catch (e) {
                currentInput = 'Error';
                isEvaluated = true;
            }
            updateDisplay();
        }

        // --- History Management ---
        
        function addToHistory(expr, result) {
            history.unshift({ expr, result });
            if (history.length > 20) history.pop(); // Keep last 20
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="text-center text-gray-500 mt-10 text-sm">No history yet</div>';
                return;
            }
            historyList.innerHTML = history.map((item, index) => `
                <div class="p-3 bg-white/5 rounded-xl hover:bg-white/10 transition cursor-pointer group" onclick="restoreHistory(${index})">
                    <div class="text-gray-400 text-xs text-right mb-1">${item.expr.replace('=', '')}</div>
                    <div class="text-white text-lg font-medium text-right group-hover:text-indigo-300 transition">${formatNumber(item.result)}</div>
                </div>
            `).join('');
        }

        function restoreHistory(index) {
            const item = history[index];
            currentExpression = item.expr.replace('=', '').trim();
            currentInput = item.result;
            isEvaluated = true;
            updateDisplay();
            if (window.innerWidth < 768) {
                toggleHistory(); // Close sidebar on mobile after selection
            }
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        // --- UI Interactions ---

        function setMode(mode) {
            if (mode === 'scientific') {
                btnSciMode.classList.add('bg-white/20', 'text-white', 'shadow-sm');
                btnSciMode.classList.remove('hover:bg-white/10');
                btnStdMode.classList.remove('bg-white/20', 'text-white', 'shadow-sm');
                btnStdMode.classList.add('hover:bg-white/10');
                
                sciKeypad.classList.remove('hidden');
                sciKeypad.classList.add('grid');
                degRadToggle.classList.remove('hidden');
            } else {
                btnStdMode.classList.add('bg-white/20', 'text-white', 'shadow-sm');
                btnStdMode.classList.remove('hover:bg-white/10');
                btnSciMode.classList.remove('bg-white/20', 'text-white', 'shadow-sm');
                btnSciMode.classList.add('hover:bg-white/10');
                
                sciKeypad.classList.add('hidden');
                sciKeypad.classList.remove('grid');
                degRadToggle.classList.add('hidden');
            }
        }

        function toggleDegRad() {
            isDegrees = !isDegrees;
            degRadToggle.innerText = isDegrees ? 'DEG' : 'RAD';
            degRadToggle.classList.toggle('text-indigo-300');
            degRadToggle.classList.toggle('text-green-300');
            degRadToggle.classList.toggle('border-indigo-500/30');
            degRadToggle.classList.toggle('border-green-500/30');
            degRadToggle.classList.toggle('bg-indigo-500/20');
            degRadToggle.classList.toggle('bg-green-500/20');
        }

        let historyOpen = false;
        function toggleHistory() {
            historyOpen = !historyOpen;
            if (historyOpen) {
                historyPanel.classList.remove('translate-x-full');
            } else {
                historyPanel.classList.add('translate-x-full');
            }
        }

        // --- Keyboard Support ---
        
        window.addEventListener('keydown', (e) => {
            const key = e.key;
            if (/[0-9]/.test(key)) appendVal(key);
            if (key === '.') appendVal('.');
            if (key === '+' || key === '-') appendOp(key === '-' ? '−' : '+');
            if (key === '*') appendOp('×');
            if (key === '/') appendOp('÷');
            if (key === 'Enter' || key === '=') { e.preventDefault(); calculate(); }
            if (key === 'Escape') clearAll();
            if (key === 'Backspace') deleteLast();
            if (key === '%') appendVal('%');
            if (key === '(' || key === ')') appendSci(key);
        });

    </script>
