<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Image Compressor - XTra Tech</title>
    <link rel="stylesheet" href="style.css?v=1.2">
    <style>
        .tool-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 80px;
        }
        .tool-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .tool-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .compress-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .compress-section {
            background: rgba(255,255,255,.05);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,.08);
        }
        .compress-section h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }
        .upload-area {
            border: 2px dashed rgba(0,229,255,.3);
            border-radius: 14px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: .3s;
            margin-bottom: 15px;
        }
        .upload-area:hover {
            border-color: #00e5ff;
            background: rgba(0,229,255,.05);
        }
        .upload-area.active {
            border-color: #00e5ff;
            background: rgba(0,229,255,.1);
        }
        .upload-area input {
            display: none;
        }
        .preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .quality-slider {
            margin: 15px 0;
        }
        .quality-slider label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .quality-slider input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 5px;
            background: rgba(255,255,255,.1);
            outline: none;
            -webkit-appearance: none;
        }
        .quality-slider input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
        }
        .quality-slider input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
            border: none;
        }
        .quality-value {
            text-align: center;
            color: #00e5ff;
            font-weight: 600;
            margin-top: 5px;
        }
        .compress-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg,#00e5ff,#7d4dff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: .3s;
        }
        .compress-btn:hover {
            box-shadow: 0 0 20px #00e5ff;
        }
        .compress-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .download-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg,#ff00c8,#ff6d00);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: .3s;
        }
        .download-btn:hover {
            box-shadow: 0 0 20px #ff00c8;
        }
        .stats {
            background: rgba(0,229,255,.1);
            border: 1px solid rgba(0,229,255,.3);
            border-radius: 10px;
            padding: 12px;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
        .loading {
            text-align: center;
            color: #00e5ff;
            font-weight: 600;
            margin-top: 10px;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,.08);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .back-btn:hover {
            background: #00e5ff;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="circle c3"></div>
        <div class="circle c4"></div>
        <div class="grid"></div>
    </div>

    <div class="tool-container">
        <button class="back-btn" onclick="window.location.href='index.html'">← Back Home</button>
        
        <div class="tool-header">
            <h1>🖼️ Image Compressor</h1>
            <p>Compress and resize images instantly</p>
        </div>

        <div class="compress-grid">
            <!-- Original Image -->
            <div class="compress-section">
                <h3>📤 Upload Image</h3>
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="imageInput" accept="image/*">
                    <p style="margin: 0; color: #b8bfd6;">
                        📁 Click or drag image here
                    </p>
                    <small style="color: #7a8199;">JPG, PNG, WebP up to 10MB</small>
                </div>
                <img id="originalPreview" class="preview-img" style="display: none;">
                <div id="originalStats" class="stats" style="display: none;"></div>
            </div>

            <!-- Compressed Image -->
            <div class="compress-section">
                <h3>✨ Compressed Image</h3>
                <div class="quality-slider">
                    <label>Compression Quality:</label>
                    <input type="range" id="qualitySlider" min="10" max="100" value="70">
                    <div class="quality-value"><span id="qualityValue">70</span>%</div>
                </div>
                <button class="compress-btn" id="compressBtn" onclick="compressImage()" disabled>🔨 Compress</button>
                <div id="loadingMsg" class="loading" style="display: none;">Compressing...</div>
                <img id="compressedPreview" class="preview-img" style="display: none;">
                <button class="download-btn" id="downloadBtn" onclick="downloadImage()" style="display: none;">⬇️ Download</button>
                <div id="compressedStats" class="stats" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="script.js?v=1.2"></script>
    <script>
        const imageInput = document.getElementById('imageInput');
        const uploadArea = document.getElementById('uploadArea');
        const originalPreview = document.getElementById('originalPreview');
        const compressedPreview = document.getElementById('compressedPreview');
        const compressBtn = document.getElementById('compressBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityValue = document.getElementById('qualityValue');
        const loadingMsg = document.getElementById('loadingMsg');
        const originalStats = document.getElementById('originalStats');
        const compressedStats = document.getElementById('compressedStats');

        let originalFile = null;
        let compressedCanvas = null;

        // Quality slider update
        qualitySlider.addEventListener('input', (e) => {
            qualityValue.textContent = e.target.value;
            if (compressedCanvas) compressImage();
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('active');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('active');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('active');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                imageInput.files = files;
                loadImage();
            }
        });

        uploadArea.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', loadImage);

        function loadImage() {
            const file = imageInput.files[0];
            if (!file) return;

            originalFile = file;
            const reader = new FileReader();

            reader.onload = (e) => {
                originalPreview.src = e.target.result;
                originalPreview.style.display = 'block';

                // Show original stats
                const sizeMB = (file.size / 1024 / 1024).toFixed(2);
                originalStats.innerHTML = `<strong>Size:</strong> ${sizeMB} MB<br><strong>Type:</strong> ${file.type}`;
                originalStats.style.display = 'block';

                compressBtn.disabled = false;
                downloadBtn.style.display = 'none';
                compressedPreview.style.display = 'none';
            };

            reader.readAsDataURL(file);
        }

        async function compressImage() {
            if (!originalFile) return;

            loadingMsg.style.display = 'block';
            compressBtn.disabled = true;

            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();

                img.onload = () => {
                    // Calculate new dimensions (resize if needed)
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 2000;

                    if (width > maxDim || height > maxDim) {
                        const ratio = Math.min(maxDim / width, maxDim / height);
                        width = Math.round(width * ratio);
                        height = Math.round(height * ratio);
                    }

                    canvas.width = width;
                    canvas.height = height;

                    ctx.drawImage(img, 0, 0, width, height);

                    const quality = qualitySlider.value / 100;
                    canvas.toBlob((blob) => {
                        compressedCanvas = canvas;

                        compressedPreview.src = canvas.toDataURL('image/jpeg', quality);
                        compressedPreview.style.display = 'block';

                        const compressedSizeMB = (blob.size / 1024 / 1024).toFixed(2);
                        const originalSizeMB = (originalFile.size / 1024 / 1024).toFixed(2);
                        const reduction = (((originalFile.size - blob.size) / originalFile.size) * 100).toFixed(1);

                        compressedStats.innerHTML = `
                            <strong>Size:</strong> ${compressedSizeMB} MB<br>
                            <strong>Reduction:</strong> ${reduction}%<br>
                            <strong>Quality:</strong> ${qualitySlider.value}%
                        `;
                        compressedStats.style.display = 'block';
                        downloadBtn.style.display = 'block';
                        loadingMsg.style.display = 'none';
                        compressBtn.disabled = false;
                    }, 'image/jpeg', quality);
                };

                img.src = originalPreview.src;
            } catch (error) {
                console.error('Error:', error);
                loadingMsg.textContent = 'Error compressing image';
                compressBtn.disabled = false;
            }
        }

        function downloadImage() {
            if (!compressedCanvas) return;

            const link = document.createElement('a');
            link.href = compressedCanvas.toDataURL('image/jpeg', qualitySlider.value / 100);
            link.download = `compressed-image-${Date.now()}.jpg`;
            link.click();
        }
    </script>
</body>
</html>
