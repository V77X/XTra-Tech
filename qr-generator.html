<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - XTra Tech</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .tool-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 80px;
        }
        .tool-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .tool-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .qr-box {
            background: rgba(255,255,255,.05);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,.08);
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 10px;
            background: rgba(255,255,255,.05);
            color: #fff;
            font-size: 16px;
        }
        .input-group input::placeholder {
            color: #b8bfd6;
        }
        .qr-display {
            text-align: center;
            background: #fff;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            display: none;
        }
        .qr-display.active {
            display: block;
        }
        .qr-display #qrcode {
            display: inline-block;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        .generate-btn, .download-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: .3s;
        }
        .generate-btn {
            background: linear-gradient(135deg,#00e5ff,#7d4dff);
        }
        .generate-btn:hover {
            box-shadow: 0 0 25px #00e5ff;
        }
        .download-btn {
            background: linear-gradient(135deg,#ff00c8,#ff6d00);
        }
        .download-btn:hover {
            box-shadow: 0 0 25px #ff00c8;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,.08);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .back-btn:hover {
            background: #00e5ff;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="circle c3"></div>
        <div class="circle c4"></div>
        <div class="grid"></div>
    </div>

    <div class="tool-container">
        <button class="back-btn" onclick="window.location.href='index.html'">← Back Home</button>
        
        <div class="tool-header">
            <h1>📱 QR Code Generator</h1>
            <p>Generate QR codes instantly</p>
        </div>

        <div class="qr-box">
            <div class="input-group">
                <label>Enter URL or Text:</label>
                <input type="text" id="qrInput" placeholder="https://example.com or any text...">
            </div>

            <div class="qr-display" id="qrDisplay">
                <div id="qrcode"></div>
            </div>

            <div class="button-group">
                <button class="generate-btn" onclick="generateQR()">Generate QR</button>
                <button class="download-btn" onclick="downloadQR()">Download QR</button>
            </div>
        </div>
    </div>

    <script>
        let qrCode = null;

        function generateQR() {
            const input = document.getElementById('qrInput').value.trim();
            const display = document.getElementById('qrDisplay');
            const qrcodeDiv = document.getElementById('qrcode');

            if (!input) {
                alert('Please enter text or URL');
                return;
            }

            // Clear previous QR code
            qrcodeDiv.innerHTML = '';
            
            // Generate new QR code
            qrCode = new QRCode(qrcodeDiv, {
                text: input,
                width: 300,
                height: 300,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });

            display.classList.add('active');
        }

        function downloadQR() {
            const qrcodeDiv = document.getElementById('qrcode');
            if (!qrcodeDiv.querySelector('img')) {
                alert('Please generate a QR code first');
                return;
            }

            const canvas = qrcodeDiv.querySelector('canvas');
            if (canvas) {
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = 'qrcode.png';
                link.click();
            }
        }

        document.getElementById('qrInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') generateQR();
        });
    </script>
</body>
</html>
