<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Tools - XTra Tech</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 80px;
        }
        .tool-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .tool-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .text-tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .tool-section {
            background: rgba(255,255,255,.05);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,.08);
        }
        .tool-section h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }
        .tool-section textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 10px;
            background: rgba(255,255,255,.05);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            resize: vertical;
            min-height: 120px;
            margin-bottom: 10px;
        }
        .tool-section textarea::placeholder {
            color: #b8bfd6;
        }
        .tool-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg,#00e5ff,#7d4dff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
            font-size: 14px;
        }
        .tool-btn:hover {
            box-shadow: 0 0 20px #00e5ff;
        }
        .stats {
            background: rgba(0,229,255,.1);
            border: 1px solid rgba(0,229,255,.3);
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,.08);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .back-btn:hover {
            background: #00e5ff;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="circle c3"></div>
        <div class="circle c4"></div>
        <div class="grid"></div>
    </div>

    <div class="tool-container">
        <button class="back-btn" onclick="window.location.href='index.html'">← Back Home</button>
        
        <div class="tool-header">
            <h1>📝 Text Tools</h1>
            <p>Convert, count, and manipulate text</p>
        </div>

        <div class="text-tools-grid">
            <!-- Case Converter -->
            <div class="tool-section">
                <h3>📰 Case Converter</h3>
                <textarea id="caseInput" placeholder="Enter text..."></textarea>
                <button class="tool-btn" onclick="toUpperCase()">UPPERCASE</button>
                <button class="tool-btn" onclick="toLowerCase()">lowercase</button>
                <button class="tool-btn" onclick="toTitleCase()">Title Case</button>
                <div class="stats" id="caseOutput">Result will appear here</div>
            </div>

            <!-- Text Counter -->
            <div class="tool-section">
                <h3>📊 Text Counter</h3>
                <textarea id="counterInput" placeholder="Enter text..." oninput="updateCounter()"></textarea>
                <div class="stats">
                    Characters: <strong id="charCount">0</strong><br>
                    Words: <strong id="wordCount">0</strong><br>
                    Lines: <strong id="lineCount">0</strong>
                </div>
            </div>

            <!-- Text Reverser -->
            <div class="tool-section">
                <h3>🔄 Reverse Text</h3>
                <textarea id="reverseInput" placeholder="Enter text..."></textarea>
                <button class="tool-btn" onclick="reverseText()">Reverse Text</button>
                <div class="stats" id="reverseOutput">Result will appear here</div>
            </div>

            <!-- Remove Duplicates -->
            <div class="tool-section">
                <h3>🎯 Remove Duplicates</h3>
                <textarea id="duplicateInput" placeholder="Enter text (one per line)..."></textarea>
                <button class="tool-btn" onclick="removeDuplicates()">Remove Duplicates</button>
                <div class="stats" id="duplicateOutput">Result will appear here</div>
            </div>
        </div>
    </div>

    <script>
        function toUpperCase() {
            const input = document.getElementById('caseInput').value;
            document.getElementById('caseOutput').textContent = input.toUpperCase();
        }

        function toLowerCase() {
            const input = document.getElementById('caseInput').value;
            document.getElementById('caseOutput').textContent = input.toLowerCase();
        }

        function toTitleCase() {
            const input = document.getElementById('caseInput').value;
            const titleCase = input.toLowerCase().split(' ').map(word => 
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
            document.getElementById('caseOutput').textContent = titleCase;
        }

        function updateCounter() {
            const text = document.getElementById('counterInput').value;
            const chars = text.length;
            const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
            const lines = text.split('\n').length;

            document.getElementById('charCount').textContent = chars;
            document.getElementById('wordCount').textContent = words;
            document.getElementById('lineCount').textContent = lines;
        }

        function reverseText() {
            const input = document.getElementById('reverseInput').value;
            const reversed = input.split('').reverse().join('');
            document.getElementById('reverseOutput').textContent = reversed;
        }

        function removeDuplicates() {
            const input = document.getElementById('duplicateInput').value;
            const lines = input.split('\n').filter(line => line.trim() !== '');
            const unique = [...new Set(lines)];
            document.getElementById('duplicateOutput').textContent = unique.join('\n');
        }
    </script>
</body>
</html>
