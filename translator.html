<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smooth Animated Site</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow-x: hidden;
    }
    section {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(2rem, 8vw, 6rem);
      opacity: 0;
      transform: translateY(50px);
    }
    .card {
      width: 300px;
      height: 400px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 20px;
      opacity: 0;
      transform: scale(0.8);
    }
  </style>
</head>
<body>
  <section>
    <h1>Hello, Smooth World</h1>
  </section>
  <section>
    <div class="card"></div>
  </section>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Fade in headline
    gsap.to("h1", {
      opacity: 1,
      y: 0,
      duration: 1.2,
      ease: "power3.out",
      delay: 0.3
    });

    // Animate card on scroll
    gsap.to(".card", {
      opacity: 1,
      scale: 1,
      duration: 1,
      ease: "power3.out",
      scrollTrigger: {
        trigger: ".card",
        start: "top 80%",
        toggleActions: "play none none reverse"
      }
    });
  </script>
</body>
</html>
