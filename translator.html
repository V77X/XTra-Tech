<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Translator - XTra Tech</title>
    <link rel="stylesheet" href="style.css?v=1.2">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 80px;
        }
        .tool-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .tool-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .translator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .translate-section {
            background: rgba(255,255,255,.05);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,.08);
        }
        .translate-section label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .translate-section select,
        .translate-section textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 10px;
            background: rgba(255,255,255,.05);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            resize: vertical;
            min-height: 150px;
        }
        .translate-section select {
            margin-bottom: 15px;
            cursor: pointer;
        }
        .translate-section textarea::placeholder {
            color: #b8bfd6;
        }
        .translate-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg,#00e5ff,#7d4dff);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: .3s;
        }
        .translate-btn:hover {
            box-shadow: 0 0 25px #00e5ff;
        }
        .translate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            color: #00e5ff;
            font-weight: 600;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,.08);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .back-btn:hover {
            background: #00e5ff;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="circle c3"></div>
        <div class="circle c4"></div>
        <div class="grid"></div>
    </div>

    <div class="tool-container">
        <button class="back-btn" onclick="window.location.href='index.html'">← Back Home</button>
        
        <div class="tool-header">
            <h1>🌐 Translator</h1>
            <p>Translate between 100+ languages</p>
        </div>

        <div class="translator-grid">
            <div class="translate-section">
                <label>From:</label>
                <select id="fromLang">
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                    <option value="auto">Auto Detect</option>
                </select>
                <textarea id="inputText" placeholder="Enter text to translate..."></textarea>
            </div>

            <div class="translate-section">
                <label>To:</label>
                <select id="toLang">
                    <option value="es">Spanish</option>
                    <option value="en">English</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh">Chinese</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                </select>
                <textarea id="outputText" placeholder="Translation will appear here..." readonly></textarea>
            </div>
        </div>

        <button class="translate-btn" id="translateBtn" onclick="translateText()">🔄 Translate</button>
        <div id="loadingMsg" class="loading" style="display: none; margin-top: 15px;">Translating...</div>
    </div>

    <script src="script.js?v=1.2"></script>
    <script>
        async function translateText() {
            const inputText = document.getElementById('inputText').value.trim();
            const fromLang = document.getElementById('fromLang').value;
            const toLang = document.getElementById('toLang').value;
            const outputText = document.getElementById('outputText');
            const btn = document.getElementById('translateBtn');
            const loading = document.getElementById('loadingMsg');

            if (!inputText) {
                outputText.value = 'Please enter text to translate';
                return;
            }

            btn.disabled = true;
            loading.style.display = 'block';

            try {
                // Using MyMemory Translation API (Free, No Key Required)
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(inputText)}&langpair=${fromLang}|${toLang}`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data.responseStatus === 200) {
                    outputText.value = data.responseData.translatedText;
                } else {
                    outputText.value = 'Translation failed. Please try again.';
                }
            } catch (error) {
                console.error('Error:', error);
                outputText.value = 'Error connecting to translation service. Please check your internet connection.';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        document.getElementById('inputText').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) translateText();
        });
    </script>
</body>
</html>
